<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t2 d2">
  <title id="t2">Lagos hub intake and loading bays</title>
  <desc id="d2">An operations drawing of a dispatch yard: numbered loading bays, banded pallets, sorted delivery groups and vans awaiting trunk departure.</desc>
  <rect width="1200" height="800" fill="#f7f8f4"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#g)" opacity="0.5"/>
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1217190f" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- asphalt yard -->
  <rect x="40" y="330" width="1120" height="430" fill="#12171908" stroke="#12171933"/>
  <g stroke="#12171922" stroke-width="2" stroke-dasharray="14 10">
    <path d="M40 470h1120"/>
    <path d="M700 330v430"/>
  </g>
  <!-- building with bays -->
  <rect x="40" y="80" width="1120" height="250" fill="#eceee9" stroke="#121719"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5c635c">
    <rect x="70" y="110" width="320" height="120" fill="#f7f8f4" stroke="#121719"/>
    <text x="86" y="132">SORTING / MANIFEST DESK</text>
    <path d="M86 150h288M86 172h288M86 194h180" stroke="#12171923"/>
  </g>
  <!-- bays -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11">
    <g>
      <rect x="440" y="230" width="150" height="100" fill="#1d6f42"/>
      <rect x="455" y="245" width="120" height="70" fill="#f7f8f4"/>
      <text x="515" y="222" fill="#121719">BAY 1</text>
      <text x="470" y="285" fill="#5c635c" font-size="10">METRO VAN</text>
    </g>
    <g>
      <rect x="620" y="230" width="150" height="100" fill="#1d6f42"/>
      <rect x="635" y="245" width="120" height="70" fill="#f7f8f4"/>
      <text x="695" y="222" fill="#121719">BAY 2</text>
      <text x="650" y="285" fill="#5c635c" font-size="10">METRO VAN</text>
    </g>
    <g>
      <rect x="800" y="230" width="150" height="100" fill="#b8460f"/>
      <rect x="815" y="245" width="120" height="70" fill="#f7f8f4"/>
      <text x="875" y="222" fill="#121719">BAY 5</text>
      <text x="826" y="285" fill="#5c635c" font-size="10">TRUNK — HOLD</text>
    </g>
    <g>
      <rect x="980" y="230" width="150" height="100" fill="#b8460f"/>
      <rect x="995" y="245" width="120" height="70" fill="#f7f8f4"/>
      <text x="1055" y="222" fill="#121719">BAY 6</text>
      <text x="1006" y="285" fill="#5c635c" font-size="10">TRUNK — HOLD</text>
    </g>
  </g>
  <!-- pallets -->
  <g stroke="#121719" fill="#eceee9">
    <rect x="120" y="520" width="150" height="110"/>
    <path d="M120 556h150M120 592h150"/>
    <rect x="300" y="520" width="150" height="110"/>
    <path d="M300 556h150M300 592h150"/>
    <rect x="480" y="520" width="150" height="110"/>
    <path d="M480 556h150M480 592h150"/>
    <rect x="120" y="660" width="150" height="80"/>
    <path d="M120 690h150M120 720h150"/>
    <rect x="300" y="660" width="150" height="80"/>
    <path d="M300 690h150M300 720h150"/>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#5c635c">
    <text x="120" y="512">BANDED PALLET / IBD TRUNK 13:00</text>
    <text x="300" y="512">BANDED PALLET / ABJ TRUNK 12:00</text>
    <text x="480" y="512">BANDED PALLET / BEN TRUNK 12:00</text>
    <text x="120" y="652">METRO GROUP — LAGOS ISLAND</text>
    <text x="300" y="652">METRO GROUP — MAINLAND NORTH</text>
  </g>
  <!-- vans -->
  <g fill="#121719">
    <path d="M820 560h180a22 22 0 0 1 22 22v70h-224v-58a34 34 0 0 1 22-34Z"/>
    <circle cx="856" cy="664" r="17" fill="#121719"/>
    <circle cx="978" cy="664" r="17" fill="#121719"/>
    <path d="M986 572h120v80h-120z" fill="#1d6f42"/>
    <circle cx="1018" cy="664" r="17" fill="#121719"/>
    <circle cx="1086" cy="664" r="17" fill="#121719"/>
  </g>
  <text x="820" y="546" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#5c635c">TRUNK VEHICLE — 7.5 t</text>
  <text x="986" y="546" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#5c635c">METRO VAN — 1.5 t</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#121719">
    <rect x="40" y="40" width="420" height="24" fill="#121719"/>
    <text x="52" y="57" fill="#eceee9">LAGOS HUB (LOS) — INTAKE &amp; SORTATION</text>
    <text x="1120" y="57" text-anchor="end" fill="#5c635c">DRAWING R234-OPS-01</text>
  </g>
</svg>